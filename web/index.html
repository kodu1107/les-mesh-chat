<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>LES Mesh Chat</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="app">
        <header class="topbar">
            <div>
                <p class="eyebrow">OPENMANET COMMUNICATIONS</p>
                <h1>LES Mesh Chat</h1>
            </div>

            <div
                id="service-status"
                class="status status-loading"
            >
                연결 확인 중
            </div>
        </header>

        <section class="layout">
            <aside class="sidebar">
                <h2>현재 노드</h2>

                <dl class="node-info">
                    <div>
                        <dt>콜사인</dt>
                        <dd id="node-callsign">-</dd>
                    </div>

                    <div>
                        <dt>노드 ID</dt>
                        <dd id="node-id">-</dd>
                    </div>

                    <div>
                        <dt>주소</dt>
                        <dd id="node-address">-</dd>
                    </div>

                    <div>
                        <dt>버전</dt>
                        <dd id="service-version">-</dd>
                    </div>
                </dl>

                <h2>피어</h2>

                <div class="empty-peer">
                    자동 검색 기능 준비 중
                </div>
            </aside>

            <section class="chat">
                <div class="channel-header">
                    <div>
                        <p class="eyebrow">CHANNEL</p>
                        <h2>전체 채팅</h2>
                    </div>

                    <span class="channel-name">
                        les-manet
                    </span>
                </div>

                <div
    id="message-list"
    class="messages"
    aria-live="polite"
    aria-label="채팅 메시지"
>
    <div
        id="empty-message"
        class="empty-message"
    >
        <strong>아직 메시지가 없습니다</strong>
        <p>첫 번째 메시지를 전송해 보세요.</p>
    </div>
</div>

<form id="message-form" class="composer">
    <label
        class="visually-hidden"
        for="message-input"
    >
        메시지
    </label>

    <input
        id="message-input"
        type="text"
        maxlength="2048"
        autocomplete="off"
        placeholder="메시지를 입력하세요"
        required
    >

    <button id="send-button" type="submit">
        전송
    </button>
</form>

<p
    id="composer-status"
    class="composer-status"
    role="status"
></p>
            </section>
        </section>
    </main>

    <script src="/app.js" defer></script>
</body>
</html>
